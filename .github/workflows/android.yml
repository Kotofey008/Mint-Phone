name: Android Pre-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-prerelease
  cancel-in-progress: false

jobs:
  build:
    name: Build universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PARKPHONE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PARKPHONE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PARKPHONE_KEY_ALIAS="$KEY_ALIAS" \
            -PARKPHONE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Prepare APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pre-release-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mint-Phone Pre-release ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Android build from commit ${GITHUB_SHA}." \
            --prerelease
